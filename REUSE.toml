version = 1
SPDX-PackageName = "dual-deployment-operator"
SPDX-PackageDownloadLocation = "https://github.com/SAP-cloud-infrastructure/dual-deployment-operator"

[[annotations]]
path = [
  ".github/renovate.json",
  ".gitignore",
  ".license-scan-overrides.jsonl",
  ".license-scan-rules.json",
  ".github/workflows/qodana_code_quality.yml",
  "qodana.yaml",
  "openspec/config.yaml",
]
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "go.mod",
  "go.sum",
  "Makefile.maker.yaml",
]
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".github/prompts/**",
  ".github/skills/**",
]
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company"
SPDX-License-Identifier = "Apache-2.0"

# Kubebuilder-generated and static config manifests (no per-file header injected
# by the scaffolder; annotate here to keep generated files free of hand edits).
[[annotations]]
path = [
  "PROJECT",
  "Dockerfile",
  ".dockerignore",
  ".custom-gcl.yml",
  ".golangci.yml",
  ".devcontainer/devcontainer.json",
  ".github/workflows/lint.yml",
  ".github/workflows/test.yml",
  ".github/workflows/test-e2e.yml",
  "config/**",
]
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company"
SPDX-License-Identifier = "Apache-2.0"

# Project documentation and OpenSpec change artifacts.
[[annotations]]
path = [
  "README.md",
  "AGENTS.md",
  "docs/**",
  "openspec/changes/**",
]
SPDX-FileCopyrightText = "SAP SE or an SAP affiliate company"
SPDX-License-Identifier = "Apache-2.0"
