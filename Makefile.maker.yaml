# Configuration file for <https://github.com/sapcc/go-makefile-maker>

metadata:
  url: https://github.com/SAP-cloud-infrastructure/dual-deployment-operator

binaries:
  - name: manager
    fromPackage: ./cmd
    installTo: bin/

controllerGen:
  enabled: true

dockerfile:
  enabled: false

golang:
  enableVendoring: false
  setGoModVersion: true

golangciLint:
  createConfig: true
  timeout: 3m

githubWorkflow:
  global:
    defaultBranch: main
    goVersion: 1.26.4
  ci:
    enabled: true
    runOn:
      - ubuntu-latest
    ignorePaths:
      - "**.md"
  license:
    enabled: true

renovate:
  enabled: true

reuse:
  annotations:
    - SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
      paths:
        - .github/**
        - .gitignore
        - .dockerignore
        - .golangci.yaml
        - .license-scan-overrides.jsonl
        - .license-scan-rules.json
        - Makefile
        - Makefile.maker.yaml
        - PROJECT
        - go.mod
        - go.sum
        - config/**
        - dist/**
        - docs/**
        - hack/**
        - openspec/**
        - qodana.yaml
        - .devcontainer/**
        - AGENTS.md
        - README.md
        - CONTRIBUTING.md

testPackages:
  except: test/e2e

verbatim: |
  # Kubebuilder developer targets (not part of CI; preserved across regeneration).
  IMG ?= controller:latest
  KUBECTL ?= kubectl
  KUSTOMIZE ?= go run sigs.k8s.io/kustomize/kustomize/v5

  .PHONY: manifests
  manifests: install-controller-gen
  	@printf "\e[1;36m>> controller-gen (manifests)\e[0m\n"
  	@controller-gen rbac:roleName=dual-deployment-operator crd webhook paths="./..." output:crd:artifacts:config=config/crd/bases output:rbac:artifacts:config=config/rbac

  .PHONY: run
  run: manifests generate
  	go run ./cmd/main.go

  .PHONY: install
  install: manifests
  	@out="$$( $(KUSTOMIZE) build config/crd 2>/dev/null || true )"; \
  	if [ -n "$$out" ]; then echo "$$out" | $(KUBECTL) apply -f -; else echo "No CRDs to install; skipping."; fi

  .PHONY: uninstall
  uninstall: manifests
  	@out="$$( $(KUSTOMIZE) build config/crd 2>/dev/null || true )"; \
  	if [ -n "$$out" ]; then echo "$$out" | $(KUBECTL) delete --ignore-not-found -f -; else echo "No CRDs to delete; skipping."; fi

  .PHONY: deploy
  deploy: manifests
  	cd config/manager && $(KUSTOMIZE) edit set image controller=$(IMG)
  	$(KUSTOMIZE) build config/default | $(KUBECTL) apply -f -

  .PHONY: undeploy
  undeploy:
  	$(KUSTOMIZE) build config/default | $(KUBECTL) delete --ignore-not-found -f -

  .PHONY: build-installer
  build-installer: manifests generate
  	mkdir -p dist
  	cd config/manager && $(KUSTOMIZE) edit set image controller=$(IMG)
  	$(KUSTOMIZE) build config/default > dist/install.yaml

  .PHONY: docker-build
  docker-build:
  	docker build -t $(IMG) .

  .PHONY: docker-push
  docker-push:
  	docker push $(IMG)

  check: test-e2e

  .PHONY: test-e2e
  test-e2e: FORCE
  	@printf "\e[1;36m>> Running E2E tests\e[0m\n"
  	go test -v -timeout 10m ./test/e2e/...
