operator: metal-operator
chartFullname: metal-operator-remote
repoURL: https://github.com/sapcc/helm-charts.git
sha: 33e68278ace26fe23e0c2b36a9266a58c9b47707
chartPath: system/metal-operator-remote
overlayValues: overlay-values.yaml
cr: cr.yaml
# comparedKinds scopes the equivalence assertion (Decision B) to the resource
# kinds both the operator (upstream chart) and today's -remote wrapper deliver.
comparedKinds:
  - CustomResourceDefinition
  - ClusterRole
  - ClusterRoleBinding
  - Role
  - RoleBinding
  - ServiceAccount
  - ValidatingWebhookConfiguration
  - MutatingWebhookConfiguration
# Objects the operator render emits no equivalent for (kind+name, justified).
exclusions:
  - kind: ConfigMap
    name: owner-info
    reason: "owner-info subchart output; operator render emits no equivalent"
# ignoreLabels: legacy delivery-mechanism labels baked into today's committed
# managedresources/ pre-render that the operator's r7 clean render does not
# reproduce (the old MR-template CRD labels + clusterctl-move marker).
ignoreLabels:
  - metal-operator-remote-webhook-injector
  - clusterctl.cluster.x-k8s.io
  - dual-deployment-operator.cc.sap/webhook-injector
# knownDivergences: in-scope objects present on exactly one side that are
# expected and must not be reported as missing/extra (kind+name, justified).
knownDivergences:
  - kind: ClusterRole
    name: metal-operator-webhook-injector
    reason: "sapcc addition (webhook-injector RBAC); upstream chart emits no equivalent"
  - kind: ClusterRoleBinding
    name: metal-operator-webhook-injector
    reason: "sapcc addition (webhook-injector RBAC binding); upstream emits none"
  - kind: ClusterRoleBinding
    name: metal-operator-webhook-injector-rolebinding
    reason: "sapcc addition (webhook-injector RBAC binding); upstream emits none"
  - kind: Role
    name: metal-operator-webhook-injector
    reason: "sapcc addition (webhook-injector RBAC); upstream emits none"
  - kind: RoleBinding
    name: metal-operator-webhook-injector
    reason: "sapcc addition (webhook-injector RBAC binding); upstream emits none"
  - kind: ServiceAccount
    name: metal-operator-webhook-injector
    reason: "sapcc addition (webhook-injector SA); upstream emits none"
