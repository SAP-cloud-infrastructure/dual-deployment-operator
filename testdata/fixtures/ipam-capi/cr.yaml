apiVersion: dual-deployment-operator.cc.sap/v1alpha1
kind: DualDeploymentOperator
metadata:
  name: ipam-capi-remote
  namespace: shoot--cp--m-qa-de-200
spec:
  shootNamespace: kube-system
  source:
    kustomize:
      # Pin to the HEAD of sapcc/helm-charts feat/ipam-capi-remote-ddo-m-qa-de-200 branch
      # (PR #13218, currently draft). This is the real DDO source.kustomize overlay for
      # ipam-capi-remote, located at system/kustomize/ipam-capi-remote-ddo/.
      # The ref is a full 40-character commit SHA (not a mutable tag/branch).
      url: "https://github.com/sapcc/helm-charts//system/kustomize/ipam-capi-remote-ddo?ref=726f6ccee8eef46152f8abc7cc0b107e6e7f9596"
      # The new DDO overlay has proper seed/ and shoot/ overlays. Both are
      # buildable with KustomizeSource — the seed overlay uses only vendored
      # resources (../base + ../additions/seed), no repo-root-relative patches.
      # This fixture tests the shoot overlay only (task-8 scope); see README.md.
      seedPath: seed
      shootPath: shoot
  shootAccess:
    secretName: ipam-capi-remote-kubeconfig
    server: https://api.m-qa-de-200.cp.internal.a-qa-de-200.soil-garden.qa-de-1.cloud.sap
  # No transformations for the equivalence fixture — we compare raw render output.
  # The ipam-capi-remote-ddo overlay itself encodes the r7 CR shape (target labels
  # for the webhook-injector, image overrides via kustomize images: transformer).
  transformations: []
