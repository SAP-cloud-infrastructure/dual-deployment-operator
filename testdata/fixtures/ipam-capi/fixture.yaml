operator: ipam-capi
repoURL: https://github.com/sapcc/helm-charts.git
sha: 33e68278ace26fe23e0c2b36a9266a58c9b47707
cr: cr.yaml
# chartPath/chartFullname/overlayValues are NOT used by this fixture's golden render
# (which uses RenderGoldenKustomize, not RenderGolden). They are present only so
# LoadFixture does not fail — the ipam-capi golden is the upstream-anchored kustomize
# overlay, not the SAP helm-charts wrapper chart. See README.md for rationale.
chartPath: ""
chartFullname: ""
overlayValues: ""

# kustomizePath is the operator-side source root AND the golden base:
#   golden = RenderGoldenKustomize(kustomizePath + "/managedresources")
#   operator = KustomizeSource(url=...?ref=sha, shootPath=managedresources)
# The managedresources/ overlay is the upstream-anchored golden: it contains
# zero SAP content — pure pointers to kubernetes-sigs/cluster-api-ipam-provider-in-cluster
# at v1.1.0 (config/crd + config/rbac) and three CAPI CRD raw files at v1.13.4.
kustomizePath: system/kustomize/ipam-capi-remote

# comparedKinds: the managedresources overlay delivers CRDs and RBAC.
# WebhookConfigurations are intentionally absent (in the separate webhooks/ overlay).
comparedKinds:
  - CustomResourceDefinition
  - ClusterRole
  - ClusterRoleBinding
  - Role
  - RoleBinding
  - ServiceAccount

# exclusions: none — both sides render the same upstream content.
exclusions: []

# knownDivergences: none expected. Both golden (direct krusty) and operator
# (KustomizeSource pipeline) render the same managedresources/ kustomization.
# The comparison validates the pipeline, not content divergence.
# Populate after the first RUN_EQUIVALENCE=1 run if any pipeline-induced
# differences surface.
knownDivergences: []

# ignoreLabels: none expected for the krusty-vs-krusty comparison.
# The global allowlist in allowlist.go covers helm.sh/chart etc.; no extra
# stripping should be needed when both sides run krusty on the same source.
ignoreLabels: []
