operator: ipam-capi
repoURL: https://github.com/sapcc/helm-charts.git
sha: 33e68278ace26fe23e0c2b36a9266a58c9b47707
# kustomizePath selects the kustomize-based golden render path instead of Helm.
# The golden render is krusty.Run on this subpath at the pinned SHA, matching the
# production kustomizeSource.Render behaviour with LoadRestrictionsNone.
# krusty will fetch transitive remote bases from github.com during the build
# (cluster-api-ipam-provider-in-cluster ?ref=v1.1.0, cluster-api CRD bases
# v1.13.4) — both are public/anonymous, no OCI registry access needed.
kustomizePath: system/kustomize/ipam-capi-remote/managedresources
cr: cr.yaml

# ── Seed overlay deliberately excluded ────────────────────────────────────────
# The seed/manager overlay is NOT covered by this fixture. See README.md for
# the full rationale; brief summary:
#   ipam-capi's manager overlay references patch files by repo-root-relative
#   paths (patches[].path: kustomize/ipam-capi-remote/manager/…).  Those paths
#   only resolve when kustomize builds from the repo root.  The operator's
#   KustomizeSource builds from the overlay subdir, so the relative paths
#   double and the build fails with "no such file".  Closing the seed overlay
#   requires extending KustomizeSource so the clone root and the kustomize-build
#   dir can differ (CRD + source change, design §9.4) — explicitly out of scope
#   here per docs/implementation.md §"ipam-capi equivalence is DEFERRED".
# ──────────────────────────────────────────────────────────────────────────────

# comparedKinds scopes the equivalence assertion to the resource kinds ipam-capi's
# shoot overlay delivers (CRDs + RBAC from cluster-api-ipam-provider-in-cluster).
comparedKinds:
  - CustomResourceDefinition
  - ClusterRole
  - ClusterRoleBinding
  - Role
  - RoleBinding
  - ServiceAccount
  - ValidatingWebhookConfiguration
  - MutatingWebhookConfiguration

# exclusions: objects present in the golden krusty build that the operator render
# has no equivalent for (e.g. RBAC the upstream kustomize source emits but the
# operator's transformation pipeline explicitly filters out). Leave empty unless
# a concrete divergence is identified at run time; add with justification.
exclusions: []

# knownDivergences: in-scope objects present on exactly one side that are expected
# and must not be reported as missing/extra. Leave empty for now; populate after
# the first real RUN_EQUIVALENCE=1 run identifies any structural divergences
# (e.g. label additions from the upstream kustomize commonLabels stanza that the
# krusty golden emits but the operator-side krusty does not, or vice-versa).
knownDivergences: []

# ignoreLabels: per-fixture label keys stripped before comparison. Add kustomize-
# provenance labels emitted by the upstream kustomize source (e.g. commonLabels
# stanza keys) that the golden krusty build produces but the operator-side render
# does not, or that differ between the two krusty runs for incidental reasons.
# Leave empty initially; populate after the first real run.
ignoreLabels: []
