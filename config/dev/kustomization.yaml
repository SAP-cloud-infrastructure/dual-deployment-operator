# Dev/CI overlay: config/default is namespace-portable (no Namespace object, so it
# installs to any namespace via an overlay's `namespace:` transformer — the kustomize
# equivalent of `helm install --namespace`). This overlay re-adds a concrete Namespace
# so `make deploy` works standalone against the default dual-deployment-operator-system.
resources:
- ../default
- namespace.yaml
