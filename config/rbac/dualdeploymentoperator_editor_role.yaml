# This rule is not used by the project dual-deployment-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dual-deployment-operator.cc.sap.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dual-deployment-operator
    app.kubernetes.io/managed-by: kustomize
  name: dualdeploymentoperator-editor-role
rules:
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators/status
  verbs:
  - get
