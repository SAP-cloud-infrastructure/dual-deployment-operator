# This rule is not used by the project dual-deployment-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over dual-deployment-operator.cc.sap.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dual-deployment-operator
    app.kubernetes.io/managed-by: kustomize
  name: dualdeploymentoperator-admin-role
rules:
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators
  verbs:
  - '*'
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators/status
  verbs:
  - get
