---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dual-deployment-operator
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators/finalizers
  verbs:
  - update
- apiGroups:
  - dual-deployment-operator.cc.sap
  resources:
  - dualdeploymentoperators/status
  verbs:
  - get
  - patch
  - update
