{{- /*
Shoot token-requestor Secret (design.md 3.6): the operator authenticates to the shoot
API server as a Gardener-minted ServiceAccount token. This empty Secret carries the
token-requestor annotations; Gardener's token-requestor controller fills token +
bundle.crt (shoot CA) asynchronously and rotates them. The operator reads them each
reconcile to build its shoot client (spec.shootAccess.secretName).

Operator install-time plumbing (paired with the shoot-applier bootstrap: this Secret
mints the token FOR the same ServiceAccount the bootstrap ClusterRoleBinding grants).
Gated off by default; the wrapper chart enables it and supplies the SA values.
*/ -}}
{{- if .Values.shootRbac.enabled }}
{{- $saName := required "shootRbac.serviceAccountName is required when shootRbac.enabled" .Values.shootRbac.serviceAccountName }}
{{- $saNamespace := required "shootRbac.serviceAccountNamespace is required when shootRbac.enabled" .Values.shootRbac.serviceAccountNamespace }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shootRbac.secretName | default "dual-deployment-operator-shoot-access" }}
  namespace: {{ default .Release.Namespace .Values.shootRbac.namespace }}
  labels:
    resources.gardener.cloud/purpose: token-requestor
    resources.gardener.cloud/class: shoot
  annotations:
    serviceaccount.resources.gardener.cloud/name: {{ $saName }}
    serviceaccount.resources.gardener.cloud/namespace: {{ $saNamespace }}
    serviceaccount.resources.gardener.cloud/inject-ca-bundle: "true"
type: Opaque
stringData:
  token: ""
  bundle.crt: ""
{{- end }}
