{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dual-deployment-operator.name" . }}
  name: {{ include "dual-deployment-operator.resourceName" (dict "suffix" "allow-remote-fetch-egress" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: {{ include "dual-deployment-operator.name" . }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.egress.to | nindent 8 }}
      ports:
        {{- toYaml .Values.networkPolicy.egress.ports | nindent 8 }}
{{- end }}
