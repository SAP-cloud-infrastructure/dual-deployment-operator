#
# Hand-authored workflow (NOT generated by go-makefile-maker).
# ci.yaml / checks.yaml / codeql.yaml are autogenerated — do NOT edit them.
#
# This job runs the `-tags online` integration tests for internal/source:
#   - Anonymous OCI pull (ghcr.io/stefanprodan/charts — public, no creds)
#   - Anonymous HTTP Helm repo pull (prometheus-community — public, no creds)
#   - Anonymous kustomize git fetch (public kubernetes-sigs/kustomize helloWorld)
#   - Authenticated OCI pull (registry:2 service with htpasswd Basic auth) — the
#     only path needing an EXTERNAL service, which is why this workflow sets one up.
#
# Why there is no git-repo setup here: the authenticated-git-clone test
# (TestGitResolverAuthedCloneSucceeds) is NOT online-tagged. It builds its own bare
# repo and an auth-gated git-http-backend server IN-PROCESS (t.TempDir + httptest),
# so it is fully hermetic and runs in the DEFAULT `Test` CI job (make check), not
# here. It needs no workflow provisioning — unlike the OCI authed test, which needs
# an external registry. Both directions are asserted there (correct creds succeed,
# wrong creds get 401).
#
# NOTE — OCI plain-HTTP limitation:
#   The production helmLoader.pullOCI uses helm's registry.NewClient without
#   ClientOptPlainHTTP(), so it requires HTTPS to authenticate. To work around this
#   in CI, the registry:2 service is configured with a self-signed TLS certificate
#   and the Go test is pointed at the HTTPS endpoint. The HELM_EXPERIMENTAL_OCI
#   env var is not needed (helm v3 has stable OCI support).
#   The self-signed cert is trusted by adding it to the system trust store inside
#   the job, so helm's registry client accepts the TLS handshake.
#   When a proper plainHTTP option is added to the loader (a future change), the
#   TLS ceremony below can be removed and the registry can run without certs.

name: online-tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  online-tests:
    name: Online integration tests (source loaders + authed OCI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Install setup-envtest
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Generate self-signed TLS cert for registry:2
        id: gencert
        run: |
          CERT_DIR=$(mktemp -d)
          echo "CERT_DIR=${CERT_DIR}" >> "$GITHUB_OUTPUT"
          openssl req -newkey rsa:2048 -nodes -keyout "${CERT_DIR}/domain.key" \
            -x509 -days 1 -out "${CERT_DIR}/domain.crt" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          echo "Self-signed cert generated at ${CERT_DIR}"

      - name: Generate htpasswd file for registry auth
        id: genauth
        run: |
          AUTH_DIR=$(mktemp -d)
          echo "AUTH_DIR=${AUTH_DIR}" >> "$GITHUB_OUTPUT"
          docker run --rm --entrypoint htpasswd httpd:2 \
            -Bbn ddo-test-user ddo-test-pass > "${AUTH_DIR}/htpasswd"
          echo "htpasswd generated at ${AUTH_DIR}/htpasswd"

      - name: Start authenticated TLS registry:2
        run: |
          docker run -d \
            --name ddo-registry \
            -p 5443:443 \
            -v "${{ steps.gencert.outputs.CERT_DIR }}:/certs:ro" \
            -v "${{ steps.genauth.outputs.AUTH_DIR }}:/auth:ro" \
            -e REGISTRY_HTTP_ADDR=0.0.0.0:443 \
            -e REGISTRY_HTTP_TLS_CERTIFICATE=/certs/domain.crt \
            -e REGISTRY_HTTP_TLS_KEY=/certs/domain.key \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM="Registry Realm" \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2
          echo "Waiting for registry to be ready..."
          for i in $(seq 1 15); do
            if curl -sk --cacert "${{ steps.gencert.outputs.CERT_DIR }}/domain.crt" \
               https://localhost:5443/v2/ -o /dev/null -w "%{http_code}" | grep -q "401"; then
              echo "Registry ready (got expected 401)"
              break
            fi
            echo "  attempt $i: not ready yet, waiting 2s..."
            sleep 2
          done

      - name: Trust self-signed cert system-wide (so helm registry client accepts it)
        run: |
          sudo cp "${{ steps.gencert.outputs.CERT_DIR }}/domain.crt" \
            /usr/local/share/ca-certificates/ddo-test-registry.crt
          sudo update-ca-certificates

      - name: Push fixture chart to authed registry
        run: |
          helm registry login localhost:5443 \
            --username ddo-test-user --password ddo-test-pass \
            --ca-file "${{ steps.gencert.outputs.CERT_DIR }}/domain.crt"

          mkdir -p /tmp/fixture-chart/templates
          cat > /tmp/fixture-chart/Chart.yaml <<'EOF'
          apiVersion: v2
          name: ddo-fixture
          version: 0.1.0
          description: Minimal fixture chart for DDO authed OCI pull test
          EOF
          helm package /tmp/fixture-chart -d /tmp/fixture-packed
          helm push /tmp/fixture-packed/ddo-fixture-0.1.0.tgz \
            "oci://localhost:5443/charts" \
            --ca-file "${{ steps.gencert.outputs.CERT_DIR }}/domain.crt"

      - name: Run online integration tests
        env:
          DDO_ONLINE_TESTS: "1"
          DDO_TEST_OCI_URL: "oci://localhost:5443/charts"
          DDO_TEST_OCI_USER: "ddo-test-user"
          DDO_TEST_OCI_PASS: "ddo-test-pass"
          DDO_TEST_OCI_CHART: "ddo-fixture"
          DDO_TEST_OCI_VERSION: "0.1.0"
        run: |
          KUBEBUILDER_ASSETS=$(setup-envtest use 1.36 -p path)
          export KUBEBUILDER_ASSETS
          go test -tags online -count=1 -v ./internal/source/... 2>&1 | tee /tmp/online-test-output.txt
          grep -E "^(=== RUN|--- PASS|--- FAIL|--- SKIP|FAIL|ok)" /tmp/online-test-output.txt || true

      - name: Stop registry:2
        if: always()
        run: docker stop ddo-registry && docker rm ddo-registry || true
